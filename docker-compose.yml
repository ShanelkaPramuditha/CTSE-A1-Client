name: ctse-a1-client

services:
  client:
    image: ghcr.io/shanelkapramuditha/ctse-a1-client:latest
    restart: unless-stopped
    ports:
      - 5173:80
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - client-nginx-cache:/var/cache/nginx
    networks:
      - client-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first

networks:
  client-network:

volumes:
  client-nginx-cache:
