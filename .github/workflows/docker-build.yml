name: Client Docker Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        default: latest

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file from DEV_ENV secret
        run: |
          printf '%s' "${{ secrets.DEV_ENV }}" > .env

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/ctse-a1-client" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=ctse-a1-client
          cache-to: type=gha,mode=max,scope=ctse-a1-client
