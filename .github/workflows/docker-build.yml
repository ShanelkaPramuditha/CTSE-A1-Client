name: Client Docker Publish

on:
  push:
    branches: [main, dev, chore/*]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        default: latest

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file from DEV_ENV secret
        run: |
          printf '%s' "${{ secrets.DEV_ENV }}" > .env

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/ctse-a1-client" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=ctse-a1-client
          cache-to: type=gha,mode=max,scope=ctse-a1-client

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.CLIENT_DEPLOY_PATH }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            DEPLOY_PATH="${{ secrets.CLIENT_DEPLOY_PATH }}"
            REPO_DIR="${{ secrets.CLIENT_REPO_DIR }}"
            if [ -z "$REPO_DIR" ]; then
              REPO_DIR="$HOME/client-repo"
            fi
            COMPOSE_SOURCE="${{ secrets.CLIENT_COMPOSE_SOURCE }}"
            if [ -z "$COMPOSE_SOURCE" ]; then
              COMPOSE_SOURCE="docker-compose.yml"
            fi

            if [ ! -d "$REPO_DIR/.git" ]; then
              if [ -n "${{ secrets.CLIENT_REPO_TOKEN }}" ]; then
                git clone "https://x-access-token:${{ secrets.CLIENT_REPO_TOKEN }}@github.com/${{ github.repository }}.git" "$REPO_DIR"
              else
                git clone "https://github.com/${{ github.repository }}.git" "$REPO_DIR"
              fi
            else
              git -C "$REPO_DIR" fetch --all --prune
            fi

            git -C "$REPO_DIR" checkout "${{ github.ref_name }}"
            git -C "$REPO_DIR" reset --hard "origin/${{ github.ref_name }}"

            if [ ! -f "$REPO_DIR/$COMPOSE_SOURCE" ]; then
              echo "Compose source file not found: $REPO_DIR/$COMPOSE_SOURCE"
              exit 1
            fi

            cp "$REPO_DIR/$COMPOSE_SOURCE" "$DEPLOY_PATH/docker-compose.yml"
            cd "$DEPLOY_PATH"

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
